name: CodeMender Scan & Token Report
on:
  # Trigger manually via the GitHub Actions UI
  workflow_dispatch:
    inputs:
      repo_name:
        description: 'The name of the repository to scan'
        required: true
        type: string

jobs:
  codemender-scan:
    runs-on: ubuntu-22.04

    permissions:
      contents: write
      pull-requests: write
      id-token: write
      security-events: write

    steps:
      # Checkout the TARGET repository instead of the central .github repo
      - name: Checkout Target Repository
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/${{ inputs.repo_name }}
          token: ${{ secrets.ORG_READ_TOKEN }} # Needs read/write access to the target repo
          fetch-depth: 0
          path: ${{ inputs.repo_name }}

      # Authenticate to Google Cloud securely
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: "${{ secrets.WIF_PROVIDER }}"
          service_account: "${{ secrets.WIF_SERVICE_ACCOUNT }}"

      # Set up the gcloud CLI
      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      # Download and Install CodeMender On-The-Fly
      - name: Install CodeMender CLI
        run: |
          echo "Downloading CodeMender from Artifact Registry..."
          gcloud artifacts generic download \
            --project=cmoc-prod \
            --location=us \
            --repository=codemender-cli-production \
            --package=cm \
            --version=stable \
            --name=cm-linux-amd64.zip \
            --destination=./
            
          unzip -q cm-linux-amd64.zip
          chmod +x cm
          sudo mv cm /usr/local/bin/cm
          cm --version

      # Configure Git Identity for the Bot
      - name: Configure Git Identity
        run: |
          git config --global user.name "CodeMender Scan Bot"
          git config --global user.email "codemender-bot@google.com"

      # The Core CodeMender Pipeline (Embedded Bash Logic)
      - name: Run CodeMender Scan
        run: |
          set -e
          echo "🚀 Starting CodeMender Scan..."

          # Initialize Workspace and create optimized config.yaml
          cm init
          # cat <<EOF > ~/.codemender/config.yaml
          # project_paths:
          #   - "$GITHUB_WORKSPACE"
          # vcs:
          #   type: "git"
          #   commands:
          #     reset: "git checkout HEAD -- ."
          # build:
          #   command: "echo 'Skipping tests for demo purposes' && true"
          # scan:
          #   extensions:
          #     include: [".js", ".ts", ".html", ".css", ".json", ".yaml", ".csproj", ".cs", ".razor"]
          # tools:
          #   confirm_commands: false
          #   confirm_writes: false
          # EOF

          # Scan Phase (Cost-Optimized Model)
          echo "🔍 Scanning codebase with Gemini 3.7 Flash..."
          cm find ./${{ inputs.repo_name }} --model gemini-3.7-flash -y 2>&1 | tee scan_output.log

          # Query Findings
          FINDINGS=$(cm report --status OPEN --format json)
          FINDINGS_COUNT=$(echo "$FINDINGS" | jq '. | length')
          echo "NO_FINDINGS=false" >> "$GITHUB_ENV"

          if [ "$FINDINGS_COUNT" -eq 0 ]; then
            echo "🎉 Success! No open vulnerabilities found."
            echo "NO_FINDINGS=true" >> "$GITHUB_ENV"
            exit 0
          fi

          echo "⚠️ Found $FINDINGS_COUNT open findings. Starting remediation..."
          echo "NO_FINDINGS=false" >> "$GITHUB_ENV"
          echo "✅ Remediation pipeline completed successfully!"

      # Generate and Publish the Report
      - name: Generate Security Report
        run: |
          echo "📊 Generating Markdown report..."
          cm report --format md > codemender_summary.md

          # Extract the execution and token usage line from the scan log
          TOKEN_SUMMARY=$(grep "Tokens:" scan_output.log | tail -n 1 || true)

          # If the token summary was found, inject it at the top of the GitHub Step Summary
          if [ -n "$TOKEN_SUMMARY" ]; then
            echo "### 🪙 Execution & Token Usage" >> $GITHUB_STEP_SUMMARY
            echo "> $TOKEN_SUMMARY" >> $GITHUB_STEP_SUMMARY
            echo "---" >> $GITHUB_STEP_SUMMARY
          fi

          echo "# CodeMender Scan Results" >> $GITHUB_STEP_SUMMARY
          cat codemender_summary.md >> $GITHUB_STEP_SUMMARY

          # Export a sarif report
          cm report --format sarif > ./${{ inputs.repo_name }}/codemender_report.sarif

          echo "# CodeMender Scan Results: SARIF" >> $GITHUB_STEP_SUMMARY
          cat ./${{ inputs.repo_name }}/codemender_report.sarif >> $GITHUB_STEP_SUMMARY
          

      - name: Format SARIF Report for GitHub UI
        run: |
          python3 -c '
          import json, re, os

          # Load raw SARIF
          with open("./${{ inputs.repo_name }}/codemender_report.sarif", "r") as f:
              data = json.load(f)

          # GitHub environment variable to extract relative path dynamically
          repo_name = os.environ.get("GITHUB_REPOSITORY", "").split("/")[-1]
          
          for run in data.get("runs", []):
              # 1. Initialize rules array if it does not exist
              driver = run.get("tool", {}).get("driver", {})
              if "rules" not in driver:
                  driver["rules"] = []
                  
              rules_map = {r["id"]: r for r in driver["rules"]}
              
              for result in run.get("results", []):
                  rule_id = result.get("ruleId")
                  full_text = result.get("message", {}).get("text", "")
                  
                  # 2. Extract relative paths (removes /home/runner/work/... prefix)
                  for loc in result.get("locations", []):
                      phys = loc.get("physicalLocation", {})
                      uri = phys.get("artifactLocation", {}).get("uri", "")
                      if repo_name and repo_name in uri:
                          # Split by repo name to catch whatever comes after it
                          relative_path = uri.split(repo_name + "/")[-1]
                          phys["artifactLocation"]["uri"] = relative_path
                          
                          # 3. Add region line parsing if found in the text (e.g., lines 13-15)
                          line_match = re.search(r"lines (\d+)-(\d+)", full_text)
                          if line_match:
                              phys["region"] = {
                                  "startLine": int(line_match.group(1)),
                                  "endLine": int(line_match.group(2))
                              }

                  # 4. Format description text into Markdown
                  # Extract summary (everything before the first double newline)
                  summary = full_text.split("\n\n")[0] if "\n\n" in full_text else full_text
                  summary = summary.split(": ")[-1] if ": " in summary else summary
                  result["message"]["text"] = summary
                  
                  # Format markdown components
                  # md_text = full_text
                  # md_text = md_text.replace("Data Path:\n", "### Data Path\n")
                  # md_text = md_text.replace("- Source:", "* **Source:**")
                  # md_text = md_text.replace("- Sanitization/Validation:", "* **Sanitization/Validation:**")
                  # md_text = md_text.replace("- Sink:", "* **Sink:**")
                  # md_text = md_text.replace("Conceptual Exploit:\n", "### Conceptual Exploit\n")
                  
                  # # Convert HTTP requests/responses into code blocks if present
                  # md_text = md_text.replace("GET / HTTP/1.1\nHost: example.com", "```http\nGET / HTTP/1.1\nHost: example.com\n```")
                  # md_text = md_text.replace("HTTP/1.1 200 OK\nContent-Type: text/html; charset=utf-8\n\n", "```http\nHTTP/1.1 200 OK\nContent-Type: text/html; charset=utf-8\n\n")
                  # md_text = md_text.replace("Public IP: <code>...</code>\n\n", "Public IP: <code>...</code>\n```\n\n")
                  
                  # 5. Populate Rule definitions
                  if rule_id not in rules_map:
                      new_rule = {
                          "id": rule_id,
                          "shortDescription": {"text": rule_id},
                          "help": {"markdown": full_text}
                      }
                      driver["rules"].append(new_rule)
                      rules_map[rule_id] = new_rule
                  else:
                      rules_map[rule_id]["help"]["markdown"] = md_text

          # Save corrected SARIF
          with open("output.sarif", "w") as f:
              f.write(json.dumps(data, indent=2))
              print(json.dumps(data, indent=2))'

      
      # Upload the SARIF payload directly to the target repository using the GitHub CLI
      - name: Upload SARIF directly via GitHub CLI
        if: env.NO_FINDINGS == 'false'
        env:
          # Explicitly bind your administrative Organization Token to the GH CLI runner
          GH_TOKEN: ${{ secrets.ORG_READ_TOKEN }}
          TARGET_REPO: ${{ inputs.repo_name }}
        run: |
          # 1. Compress the SARIF file into GZIP Base64 format as required by the API
          SARIF_BASE64=$(gzip -c "output.sarif" | base64 -w 0)
          
          # 2. Extract the exact commit hash of the checked-out codebase
          COMMIT_SHA=$(git -C "${TARGET_REPO}" rev-parse HEAD)
          
          # 3. Safely resolve the active branch reference name
          BRANCH_REF=$(git -C "${TARGET_REPO}" symbolic-ref HEAD 2>/dev/null || echo "refs/heads/main")
          
          echo "Uploading SARIF payload natively to ${{ github.repository_owner }}/${TARGET_REPO}..."
          
          # 4. Execute the secure POST request directly through the GH CLI engine
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/${{ github.repository_owner }}/${TARGET_REPO}/code-scanning/sarifs" \
            -f commit_sha="$COMMIT_SHA" \
            -f ref="$BRANCH_REF" \
            -f sarif="$SARIF_BASE64" \
            -f tool_name="CodeMender"

      # Cleanup Sensitive Binaries (Best Practice)
      - name: Cleanup
        if: always()
        run: |
          rm -f cm-linux-amd64.zip
          rm -f cm
          rm -rf .cm_project
          rm -rf .exploit/
          rm -f gha-creds-*.json
